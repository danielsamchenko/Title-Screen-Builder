<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VHS Title Builder</title>
<!-- Optional free fonts for the picker. Offline, the app still works and those fonts fall back. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Audiowide&family=Bungee&family=Chakra+Petch:wght@700&family=Exo+2:wght@800&family=Major+Mono+Display&family=Michroma&family=Monoton&family=Orbitron:wght@900&family=Oxanium:wght@800&family=Press+Start+2P&family=Rajdhani:wght@700&family=Russo+One&family=Share+Tech+Mono&family=Syncopate:wght@700&family=VT323&display=swap">
<style>
  :root {
    --bg: #0a080d;
    --panel: #131017;
    --panel-2: #1a1620;
    --line: #29232f;
    --text: #ece6f0;
    --muted: #958aa1;
    --accent: #ff4fa8;
    --accent-2: #9b5cff;
    --rec: #ff3348;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, select, input { font: inherit; color: inherit; }

  .app { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: 100vh; }

  /* ---------- stage ---------- */
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 14px 18px 16px; gap: 12px; }
  header { display: flex; align-items: center; gap: 12px; }
  .brand { font-weight: 800; letter-spacing: .22em; font-size: 11px; text-transform: uppercase; color: var(--muted); margin-right: auto; }
  .brand b { color: var(--accent); text-shadow: 0 0 10px rgba(255, 79, 168, .6); }
  .viewport { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #screen { display: block; background: #000; border-radius: 4px;
    box-shadow: 0 0 0 1px var(--line), 0 24px 70px rgba(0, 0, 0, .7), 0 0 120px rgba(155, 92, 255, .08); }

  .transport { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; }
  .transport input[type=range] { flex: 1; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; text-align: right; font-size: 12px; }

  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: border-color .15s, background .15s; }
  .btn:hover { border-color: #463c50; background: #211b28; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.icon { width: 34px; height: 34px; padding: 0; justify-content: center; }
  .btn.primary { background: linear-gradient(135deg, #ff4fa8, #9b5cff); border-color: transparent; color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.recording { background: var(--rec); border-color: transparent; color: #fff; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .recording .dot { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .btn svg { width: 14px; height: 14px; fill: currentColor; }

  /* ---------- sidebar ---------- */
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; }
  details { border-bottom: 1px solid var(--line); }
  summary { list-style: none; cursor: pointer; padding: 13px 16px; font-weight: 650; font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: #cfc4d8; display: flex; align-items: center; justify-content: space-between; user-select: none; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--muted); font-size: 15px; font-weight: 400; }
  details[open] summary::after { content: "–"; }
  .body { padding: 0 16px 16px; display: grid; gap: 12px; }
  .field { display: grid; gap: 5px; }
  .field > .top { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .field > .top output { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=text], select { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; outline: none; }
  input[type=text]:focus, select:focus { border-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  .fonts { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 38px; gap: 6px; max-height: 236px; overflow-y: auto; padding: 2px; margin: -2px; }
  .font-tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 0 9px; cursor: pointer; height: 38px;
    font-size: 15px; line-height: 1.1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e9dff0; }
  .font-tile:hover { border-color: #463c50; }
  .font-tile.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; color: #fff; }
  .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .color { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .color input { width: 30px; height: 26px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: none; cursor: pointer; flex: none; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; }
  .check input { accent-color: var(--accent); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .note { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .note code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; display: block;
    margin-top: 6px; font: 11px/1.45 ui-monospace, Menlo, monospace; color: #e6d9ee; user-select: all; word-break: break-all; }
  .foot { padding: 14px 16px 20px; display: flex; gap: 8px; }
  .foot .btn { flex: 1; justify-content: center; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .stage { padding: 12px 16px; }
    .viewport { flex: none; aspect-ratio: 16 / 9; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    header .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <header>
      <div class="brand"><b>VHS</b> Title Builder</div>
      <button class="btn hide-sm" id="pngBtn" title="Save the current frame as a 1920×1080 PNG">Save frame</button>
      <button class="btn primary" id="recBtn" title="Record the full animation as a 1920×1080 video"><span class="dot"></span><span id="recLabel">Export video</span></button>
    </header>
    <div class="viewport" id="viewport"><canvas id="screen"></canvas></div>
    <div class="transport">
      <button class="btn icon" id="playBtn" title="Play / pause (Space)"></button>
      <button class="btn icon" id="replayBtn" title="Replay from start">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
      </button>
      <button class="btn icon" id="muteBtn" title="Sound on / off (preview only)"></button>
      <input type="range" id="scrub" min="0" max="6" step="0.01" value="0" aria-label="Timeline">
      <div class="time" id="time">0.00 / 6.00s</div>
    </div>
  </section>
  <aside id="panel"></aside>
</div>

<input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" hidden>

<script>
(() => {
'use strict';

const W = 1920, H = 1080;
const STORE_KEY = 'vhs-title-builder:v2';   // bumped when defaults change

const FONTS = {
  arialBlack: { label: 'Arial Black',      family: '"Arial Black", "Arial Bold", Gadget, Arial, sans-serif', weight: 900 },
  impact:     { label: 'Impact',           family: 'Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif', weight: 400 },
  helvetica:  { label: 'Helvetica Bold',   family: '"Helvetica Neue", Helvetica, Arial, sans-serif', weight: 800 },
  futura:     { label: 'Futura',           family: 'Futura, "Century Gothic", "Trebuchet MS", sans-serif', weight: 800 },
  georgia:    { label: 'Georgia',          family: 'Georgia, "Times New Roman", serif', weight: 700 },
  times:      { label: 'Times',            family: '"Times New Roman", Times, serif', weight: 400 },
  courier:    { label: 'Courier',          family: '"Courier New", Courier, monospace', weight: 700 },
  menlo:      { label: 'Menlo',            family: 'Menlo, Monaco, Consolas, monospace', weight: 700 },
  orbitron:   { label: 'Orbitron',         family: 'Orbitron, sans-serif', weight: 900 },
  audiowide:  { label: 'Audiowide',        family: 'Audiowide, sans-serif', weight: 400 },
  michroma:   { label: 'Michroma',         family: 'Michroma, sans-serif', weight: 400 },
  russo:      { label: 'Russo One',        family: '"Russo One", sans-serif', weight: 400 },
  exo:        { label: 'Exo 2',            family: '"Exo 2", sans-serif', weight: 800 },
  oxanium:    { label: 'Oxanium',          family: 'Oxanium, sans-serif', weight: 800 },
  chakra:     { label: 'Chakra Petch',     family: '"Chakra Petch", sans-serif', weight: 700 },
  rajdhani:   { label: 'Rajdhani',         family: 'Rajdhani, sans-serif', weight: 700 },
  syncopate:  { label: 'Syncopate',        family: 'Syncopate, sans-serif', weight: 700 },
  shareTech:  { label: 'Share Tech Mono',  family: '"Share Tech Mono", monospace', weight: 400 },
  vt323:      { label: 'VT323',            family: 'VT323, monospace', weight: 400 },
  pressStart: { label: 'Press Start 2P',   family: '"Press Start 2P", monospace', weight: 400 },
  majorMono:  { label: 'Major Mono',       family: '"Major Mono Display", monospace', weight: 400 },
  bungee:     { label: 'Bungee',           family: 'Bungee, sans-serif', weight: 400 },
  monoton:    { label: 'Monoton',          family: 'Monoton, sans-serif', weight: 400 },
  anton:      { label: 'Anton',            family: 'Anton, sans-serif', weight: 400 },
  archivo:    { label: 'Archivo Black',    family: '"Archivo Black", sans-serif', weight: 400 },
};

const DEFAULTS = {
  line1: 'Summer', line2: 'Memories', subtitle: '',
  font: 'arialBlack', uppercase: true,
  titleSize: 220, letterSpacing: 6, lineHeight: 0.98, titleX: 0, titleY: 0,
  subSize: 40, subSpacing: 16, subY: 250,
  bgColor: '#07040a', textColor: '#ffcdea', glowColor: '#ff2f9e', glow2Color: '#8a3dff',
  abColorA: '#ff4a14', abColorB: '#2266ff',
  glow: 1.3, blur: 3.5, smear: 0.55, aberration: 7, scanlines: 0.65, grain: 0.65, distortion: 0.7,
  flicker: 0.5, tracking: 0.7, vignette: 0.7,
  duration: 6, intro: 2.4, loop: true, fadeOut: false,
  format: '', fps: 30, bitrate: 20,
  audioOn: true, audioExport: true,
  volMaster: 0.8, volHiss: 0.5, volStatic: 0.6, volGlitch: 0.6, volBeep: 0.5, volTv: 0.7,
};

// Keys that only affect per-frame effects; everything else requires re-rasterising the text.
const LIVE_KEYS = new Set(['audioOn', 'audioExport', 'volMaster', 'volHiss', 'volStatic', 'volGlitch', 'volBeep', 'volTv', 'smear', 'aberration', 'scanlines', 'grain', 'distortion', 'flicker', 'tracking', 'vignette',
  'duration', 'intro', 'loop', 'fadeOut', 'format', 'fps', 'bitrate', 'bgColor']);

let S = load();

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    const merged = { ...DEFAULTS, ...saved };
    if (!FONTS[merged.font]) merged.font = DEFAULTS.font;
    return merged;
  } catch { return { ...DEFAULTS }; }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {}
}

/* ================================================================
   Helpers
   ================================================================ */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const smooth = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const hash = n => { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}
const hasLetterSpacing = 'letterSpacing' in CanvasRenderingContext2D.prototype;

function lineWidth(c, str, sp) {
  const chars = [...str];
  if (hasLetterSpacing) { c.letterSpacing = sp + 'px'; return Math.max(0, c.measureText(str).width - (chars.length ? sp : 0)); }
  let w = 0; for (const ch of chars) w += c.measureText(ch).width;
  return w + sp * Math.max(0, chars.length - 1);
}
function drawLine(c, str, x, y, sp) {
  if (hasLetterSpacing) { c.letterSpacing = sp + 'px'; c.fillText(str, x, y); return; }
  let cx = x;
  for (const ch of str) { c.fillText(ch, cx, y); cx += c.measureText(ch).width + sp; }
}

// Blur via an offset shadow: works in every browser, unlike ctx.filter.
function blurPaint(c, paint, color, blur, alpha = 1) {
  c.save();
  c.globalAlpha = alpha;
  if (blur < 0.5) { paint(c, color); c.restore(); return; }
  const OFF = 30000;
  c.shadowColor = color; c.shadowBlur = blur; c.shadowOffsetX = OFF;
  c.translate(-OFF, 0);
  paint(c, '#000');
  c.restore();
}

/* ================================================================
   Pre-rendered layers (rebuilt only when text/colour settings change)
   ================================================================ */
const canvas = document.getElementById('screen');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');

let titleG = null, subG = null, haze = null, dirty = true;
let frameSound = { intro: 0, hic: 0, fade: 0, track: 0, fi: 0 };
let customFontLabel = null;

function fontSpec(size) {
  if (S.font === 'custom' && customFontLabel) return `400 ${size}px "VHSCustomFont", sans-serif`;
  const f = FONTS[S.font] || FONTS.arialBlack;
  return `${f.weight} ${size}px ${f.family}`;
}

function buildGroup(lines, size, sp, lh, cx, cy) {
  lines = lines.filter(l => l.trim().length);
  if (!lines.length) return null;
  const font = fontSpec(size);
  const m = mk(1, 1).getContext('2d');
  m.font = font;
  const capH = m.measureText('H').actualBoundingBoxAscent || size * 0.72;
  const widths = lines.map(l => lineWidth(m, l, sp));
  const maxW = Math.max(...widths);
  const gap = size * lh;
  const blockH = capH + (lines.length - 1) * gap;
  const pad = Math.ceil(size * 0.35 * Math.max(0.4, S.glow) + S.blur * 3 + 60);
  const x0 = Math.floor(cx - maxW / 2 - pad);
  const y0 = Math.floor(cy - blockH / 2 - pad);
  const w = Math.ceil(maxW + pad * 2);
  const h = Math.ceil(blockH + pad * 2 + size * 0.3);

  const paint = (c, fill) => {
    c.font = font; c.textBaseline = 'alphabetic'; c.textAlign = 'left'; c.fillStyle = fill;
    lines.forEach((l, i) => drawLine(c, l, cx - widths[i] / 2 - x0, cy - blockH / 2 + capH + i * gap - y0, sp));
  };
  const layer = () => { const c = mk(w, h); return [c, c.getContext('2d')]; };

  const [core, cc] = layer();
  if (S.blur > 0.5) blurPaint(cc, paint, S.textColor, S.blur * 1.6, 0.9);
  blurPaint(cc, paint, S.textColor, S.blur * 0.45, S.blur > 0.5 ? 0.85 : 1);

  const [glow, gc] = layer();
  const g = S.glow;
  blurPaint(gc, paint, S.glow2Color, size * 0.4, clamp(g * 0.9));
  blurPaint(gc, paint, S.glow2Color, size * 0.18, clamp(g * 0.6));
  blurPaint(gc, paint, S.glowColor, size * 0.13, clamp(g));
  blurPaint(gc, paint, S.glowColor, size * 0.045 + S.blur, clamp(g * 0.9));
  if (g > 1) blurPaint(gc, paint, S.glowColor, size * 0.08, clamp(g - 1));

  const [ghostA, ac] = layer();
  blurPaint(ac, paint, S.abColorA, S.blur * 1.5 + 3, 0.95);
  const [ghostB, bc] = layer();
  blurPaint(bc, paint, S.abColorB, S.blur * 1.5 + 3, 0.95);

  // Horizontal smear: VHS luma bleeds to the right, chroma bleeds both ways.
  const [smear, sm] = layer();
  const reach = size * 0.45, steps = 14;
  for (let i = 1; i <= steps; i++) {
    const k = i / steps;
    sm.globalAlpha = 0.16 * (1 - k) * (1 - k);
    sm.drawImage(core, reach * k, 0);
    sm.drawImage(glow, -reach * k * 0.5, 0);
  }

  return { x: x0, y: y0, w, h, cy, half: blockH / 2, core, glow, ghostA, ghostB, smear, scratch: mk(w, h) };
}

function rebuild() {
  dirty = false;
  const up = s => (S.uppercase ? s.toUpperCase() : s);
  const cx = W / 2 + S.titleX, cy = H / 2 + S.titleY;
  titleG = buildGroup([up(S.line1), up(S.line2)], S.titleSize, S.letterSpacing, S.lineHeight, cx, cy);
  subG = buildGroup([up(S.subtitle)], S.subSize, S.subSpacing, 1.2, cx, S.subY);

  // Faint coloured haze behind the title, like light bleeding through the tape.
  haze = mk(W, H);
  const hc = haze.getContext('2d');
  const grad = hc.createRadialGradient(cx, cy, 0, cx, cy, W * 0.5);
  grad.addColorStop(0, hexA(S.glow2Color, 0.3));
  grad.addColorStop(0.45, hexA(S.glowColor, 0.09));
  grad.addColorStop(1, hexA(S.glow2Color, 0));
  hc.fillStyle = grad; hc.fillRect(0, 0, W, H);
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

// Static overlays built once.
const NOISE_W = 640, NOISE_H = 360;   // scaled 3x for a coarser, tape-like grain
const noise = Array.from({ length: 6 }, () => {
  const c = mk(NOISE_W, NOISE_H), x = c.getContext('2d');
  const img = x.createImageData(NOISE_W, NOISE_H), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = Math.random() * 255;
    const cr = (Math.random() - 0.5) * 70, cb = (Math.random() - 0.5) * 70;   // chroma noise
    d[i] = n + cr; d[i + 1] = n; d[i + 2] = n + cb; d[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c;
});

const scanPattern = (() => {
  const c = mk(1, 4), x = c.getContext('2d');
  x.fillStyle = 'rgba(0,0,0,0.35)'; x.fillRect(0, 1, 1, 1);
  x.fillStyle = 'rgba(0,0,0,1)';    x.fillRect(0, 2, 1, 1);
  x.fillStyle = 'rgba(0,0,0,0.35)'; x.fillRect(0, 3, 1, 1);
  return ctx.createPattern(c, 'repeat');
})();

const vignette = (() => {
  const c = mk(W, H), x = c.getContext('2d');
  const g = x.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.6, 'rgba(0,0,0,0.45)');
  g.addColorStop(1, 'rgba(0,0,0,0.95)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  return c;
})();

/* ================================================================
   Animation timeline
   ================================================================ */
// Everything is seeded by the time, so replays and recordings look identical.
function groupState(t, delay, span, seed) {
  const D = S.duration;
  const I = Math.max(0.05, Math.min(S.intro, D));
  const start = I * delay, len = I * span;
  const p = clamp((t - start) / len);
  const fi = Math.floor(t * 24);            // glitches update at ~24 Hz, like tape frames

  let alpha = smooth(0, 0.55, p);
  if (p < 0.8) {                             // signal drop-outs while locking on
    const r = hash(fi * 1.13 + seed);
    if (r < (1 - p / 0.8) * 0.6) alpha *= 0.12 + r;
  }
  let glitch = Math.pow(1 - smooth(0, 1, p), 1.6);
  const intro = glitch;
  let hic = 0, fade = 0;

  if (p >= 1) {                              // occasional tracking hiccups once settled
    const win = Math.floor(t * 2);
    if (hash(win * 5.17 + seed + 11) < 0.04 + 0.2 * S.distortion) {
      const lt = t - win / 2, dur = 0.06 + hash(win + seed) * 0.16;
      if (lt < dur) { hic = (0.2 + 0.45 * hash(win * 2.3 + seed)) * S.distortion; glitch = Math.max(glitch, hic); }
    }
  }

  if (S.fadeOut) {
    const fo = Math.min(1, D * 0.25);
    const k = clamp((D - t) / fo);
    if (k < 1) {
      alpha *= k * (hash(fi * 3.7 + seed) < 0.3 * (1 - k) ? 0.3 : 1);
      fade = 1 - k;
      glitch = Math.max(glitch, fade * 0.7);
    }
  }

  alpha *= 1 - S.flicker * 0.14 * hash(fi * 0.71 + seed + 4);
  const amp = 0.3 + S.distortion;
  return {
    alpha, glitch, fi, seed, intro, hic, fade,
    // Analog "locking on": a small shake, a vertical roll that settles, and the text
    // emerging from its own bloom. No RGB split boost and no hard slice tearing.
    dx: (hash(fi * 4.1 + seed + 5) - 0.5) * 2 * 6 * glitch * amp,
    dy: (hash(fi * 6.3 + seed + 6) - 0.5) * 2 * 4 * glitch - Math.pow(1 - smooth(0, 1, p), 2) * 26,
    core: 1 - 0.55 * glitch,
    glow: (0.9 + 0.1 * Math.sin(t * 6.1 + seed) * (0.5 + S.flicker)) * (1 + 0.35 * glitch),
  };
}

/* ================================================================
   Frame renderer
   ================================================================ */
function drawGroup(g, st, trackY, fi) {
  if (!g || st.alpha <= 0.003) return;
  const s = g.scratch.getContext('2d');
  s.globalCompositeOperation = 'source-over'; s.globalAlpha = 1;
  s.clearRect(0, 0, g.w, g.h);
  s.globalCompositeOperation = 'lighter';
  const ab = S.aberration;
  s.globalAlpha = clamp(st.glow); s.drawImage(g.glow, 0, 0);
  s.globalAlpha = 0.9;
  s.drawImage(g.ghostA, -ab, -ab * 0.1);
  s.drawImage(g.ghostB, ab, ab * 0.1);
  if (S.smear > 0) { s.globalAlpha = clamp(S.smear * (1 + 0.5 * st.glitch)); s.drawImage(g.smear, 0, 0); }
  s.globalAlpha = st.core; s.drawImage(g.core, 0, 0);

  // The block moves as one piece (shake + roll). Only where the rolling tracking
  // band crosses it do lines get dragged sideways, like a tape tracking error.
  ctx.save();
  ctx.globalAlpha = clamp(st.alpha);
  ctx.globalCompositeOperation = 'lighter';
  const x = g.x + Math.round(st.dx), y = g.y + Math.round(st.dy);
  const HALF = 34;
  const top = clamp(Math.round(trackY - HALF - y), 0, g.h);
  const bot = clamp(Math.round(trackY + HALF - y), 0, g.h);
  if (S.tracking <= 0 || bot <= top) {
    ctx.drawImage(g.scratch, x, y);
  } else {
    if (top > 0) ctx.drawImage(g.scratch, 0, 0, g.w, top, x, y, g.w, top);
    if (bot < g.h) ctx.drawImage(g.scratch, 0, bot, g.w, g.h - bot, x, y + bot, g.w, g.h - bot);
    const row = 2;
    for (let r = top; r < bot; r += row) {
      const hh = Math.min(row, bot - r);
      const f = 1 - Math.abs(y + r - trackY) / HALF;          // strongest in the band's centre
      const jag = hash(fi * 3.3 + Math.floor((y + r) / row) * 0.71);
      const off = Math.round(f * S.tracking * (14 + 30 * jag * jag));
      ctx.drawImage(g.scratch, 0, r, g.w, hh, x + off, y + r, g.w, hh);
    }
  }
  ctx.restore();
}

function render(t) {
  if (dirty) rebuild();
  const fi = Math.floor(t * 24);

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = S.bgColor;
  ctx.fillRect(0, 0, W, H);

  const ts = groupState(t, 0, 1, 1.7);
  const ss = groupState(t, 0.3, 0.7, 9.3);

  ctx.globalAlpha = clamp(S.glow) * clamp(ts.alpha) * 0.9;
  ctx.drawImage(haze, 0, 0);
  ctx.globalAlpha = 1;

  const trackY = ((t * 0.09 + 0.35) % 1.5 - 0.25) * H;
  drawGroup(subG, ss, trackY, fi);
  drawGroup(titleG, ts, trackY, fi);

  // What the soundtrack follows this frame.
  let track = 0;
  if (titleG && S.tracking > 0) track = clamp(1 - Math.abs(trackY - titleG.cy) / (titleG.half + 40)) * clamp(ts.alpha * 2);
  frameSound = { intro: ts.intro, hic: ts.hic, fade: ts.fade, track, fi };

  // Rolling tracking band.
  if (S.tracking > 0) {
    ctx.globalCompositeOperation = 'lighter';
    const tg = ctx.createLinearGradient(0, trackY - 60, 0, trackY + 60);
    tg.addColorStop(0, 'rgba(255,255,255,0)');
    tg.addColorStop(0.5, `rgba(220,210,255,${0.045 * S.tracking})`);
    tg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = tg; ctx.fillRect(0, trackY - 60, W, 120);
    ctx.globalAlpha = 0.22 * S.tracking;
    const k = noise[(Math.random() * noise.length) | 0];
    ctx.drawImage(k, 0, Math.random() * (NOISE_H - 8), NOISE_W, 4, 0, trackY - 6, W, 12);
    ctx.globalAlpha = 1;

    // Head-switching noise along the bottom edge.
    ctx.globalCompositeOperation = 'source-over';
    const hb = 16;
    ctx.drawImage(canvas, 0, H - hb, W, hb, 20 + Math.random() * 40 * S.tracking, H - hb - 2, W, hb);
    ctx.globalAlpha = 0.55 * S.tracking;
    ctx.drawImage(noise[(Math.random() * noise.length) | 0], 0, Math.random() * (NOISE_H - 10), NOISE_W, 6, 0, H - 12, W, 12);
    ctx.globalAlpha = 1;
  }

  // Film / tape grain.
  if (S.grain > 0) {
    const k = noise[(Math.random() * noise.length) | 0];
    const ox = Math.random() * 40, oy = Math.random() * 24;
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = Math.min(1, S.grain * (0.75 + 0.6 * ts.glitch));
    ctx.drawImage(k, -ox, -oy, W + 40, H + 24);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = S.grain * 0.07;
    ctx.drawImage(k, -ox, -oy, W + 40, H + 24);
    // Rare white drop-out streaks.
    if (Math.random() < 0.3 * S.grain) {
      ctx.globalAlpha = 0.25 + Math.random() * 0.45;
      ctx.fillStyle = '#fff';
      const n = 1 + (Math.random() * 3) | 0;
      for (let i = 0; i < n; i++) ctx.fillRect(Math.random() * W, Math.random() * H, 30 + Math.random() * 380, 1 + Math.random() * 1.5);
    }
    ctx.globalAlpha = 1;
  }

  ctx.globalCompositeOperation = 'source-over';

  if (S.scanlines > 0) {
    ctx.globalAlpha = S.scanlines * 0.6;
    ctx.fillStyle = scanPattern;
    ctx.fillRect(0, 0, W, H);
  }

  if (S.vignette > 0) {
    ctx.globalAlpha = S.vignette;
    ctx.drawImage(vignette, 0, 0);
  }

  if (S.flicker > 0) {
    ctx.globalAlpha = S.flicker * (0.03 + 0.09 * hash(fi * 0.37 + 2));
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    if (hash(fi * 0.91 + 3) < 0.05 * S.flicker) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.04;
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ================================================================
   Sound: everything is synthesised with Web Audio, no sample files.
   ================================================================ */
const Sound = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  let ac = null, n = null;

  function ensure() {
    if (!ac) build();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }

  function build() {
    ac = new AC();
    const len = ac.sampleRate * 2;
    const noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    const master = ac.createGain();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2;
    const monitor = ac.createGain();
    const dest = ac.createMediaStreamDestination ? ac.createMediaStreamDestination() : null;
    master.connect(comp); comp.connect(monitor); monitor.connect(ac.destination);
    if (dest) comp.connect(dest);

    const filter = (type, freq, q = 0.7) => { const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q; return f; };
    const gain = (v = 0) => { const g = ac.createGain(); g.gain.value = v; return g; };
    const loopNoise = () => { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(0, Math.random() * 2); return s; };
    const chain = (...nodes) => { for (let i = 0; i < nodes.length - 1; i++) nodes[i].connect(nodes[i + 1]); return nodes[nodes.length - 1]; };

    // Tape hiss + mains hum (continuous while playing).
    const hiss = gain();
    chain(loopNoise(), filter('highpass', 2200), filter('lowpass', 11000), hiss);
    const hum = ac.createOscillator(); hum.frequency.value = 60;
    const hum3 = ac.createOscillator(); hum3.frequency.value = 180;
    const humG = gain(0.18), hum3G = gain(0.05);
    hum.connect(humG); hum3.connect(hum3G); humG.connect(hiss); hum3G.connect(hiss);
    hum.start(); hum3.start();
    hiss.connect(master);

    // Static rush (follows the glitch-in and glitch-out).
    const stat = gain();
    chain(loopNoise(), filter('bandpass', 3200, 0.4), stat, master);

    // Tracking glitch: warbling band-passed noise plus a rough 59 Hz buzz.
    const glitch = gain();
    const gbp = filter('bandpass', 900, 3);
    chain(loopNoise(), gbp, glitch);
    const lfo = ac.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 11;
    const lfoG = gain(500); lfo.connect(lfoG); lfoG.connect(gbp.frequency); lfo.start();
    const buzz = ac.createOscillator(); buzz.type = 'sawtooth'; buzz.frequency.value = 59;
    chain(buzz, filter('lowpass', 1400), gain(0.35), glitch);
    buzz.start();
    glitch.connect(master);

    n = { master, monitor, dest, hiss, stat, glitch, noiseBuf, filter, gain };
  }

  // One-shot helpers.
  function env(g, at, attack, peak, decay) {
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(peak, at + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, at + attack + decay);
  }
  function burst(at, dur, peak, type, freq, q = 0.7, attack = 0.002) {
    const s = ac.createBufferSource(); s.buffer = n.noiseBuf;
    const g = n.gain();
    s.connect(n.filter(type, freq, q)).connect(g).connect(n.master);
    env(g, at, attack, peak, dur);
    s.start(at, Math.random() * 1.5); s.stop(at + attack + dur + 0.05);
  }
  function tone(at, type, f0, f1, attack, peak, decay) {
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, at);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, at + attack + decay);
    const g = n.gain();
    o.connect(g).connect(n.master);
    env(g, at, attack, peak, decay);
    o.start(at); o.stop(at + attack + decay + 0.05);
  }
  const ready = () => ac && ac.state === 'running';

  return {
    ensure,
    // Audio track for the exporter (null if unsupported).
    track() { ensure(); return n.dest ? n.dest.stream.getAudioTracks()[0] || null : null; },

    // Called every frame with what the picture is doing.
    update(fs, isPlaying) {
      if (!ready()) return;
      const now = ac.currentTime, on = isPlaying ? 1 : 0;
      n.monitor.gain.setTargetAtTime(S.audioOn ? 1 : 0, now, 0.02);
      n.master.gain.setTargetAtTime(S.volMaster, now, 0.03);
      n.hiss.gain.setTargetAtTime(on * S.volHiss * 0.09, now, 0.05);
      const crackle = 0.55 + 0.45 * hash(fs.fi * 2.71 + 5);
      n.stat.gain.setTargetAtTime(on * S.volStatic * 0.42 * clamp(fs.intro * 1.1 + fs.fade) * crackle, now, 0.015);
      const g = clamp(fs.hic * 1.6 + fs.track * S.tracking * 0.9 + fs.fade * 0.5);
      n.glitch.gain.setTargetAtTime(on * S.volGlitch * 0.5 * g * (0.4 + 0.6 * hash(fs.fi * 1.37 + 9)), now, 0.01);
    },

    // CRT power-on: relay click, degauss thunk, flyback whine, static rush.
    tvOn() {
      if (!ready() || S.volTv <= 0) return;
      const t = ac.currentTime + 0.01, v = S.volTv;
      burst(t, 0.02, 0.7 * v, 'highpass', 1800);
      tone(t + 0.01, 'sine', 70, 42, 0.01, 0.55 * v, 0.9);
      tone(t + 0.01, 'triangle', 120, 90, 0.01, 0.12 * v, 0.6);
      tone(t + 0.05, 'sine', 15200, 15200, 0.15, 0.025 * v, 1.6);
      burst(t + 0.03, 0.9, 0.38 * v, 'bandpass', 3000, 0.5, 0.03);
    },
    // CRT power-off: pop, collapsing tone, short static.
    tvOff() {
      if (!ready() || S.volTv <= 0) return;
      const t = ac.currentTime + 0.01, v = S.volTv;
      burst(t, 0.015, 0.6 * v, 'highpass', 1500);
      tone(t, 'sine', 1800, 45, 0.005, 0.3 * v, 0.32);
      burst(t, 0.18, 0.25 * v, 'bandpass', 2500, 0.6);
    },
    // Camcorder "recording" double beep.
    beep() {
      if (!ready() || S.volBeep <= 0) return;
      const t = ac.currentTime + 0.01, v = S.volBeep;
      tone(t, 'triangle', 2950, 2950, 0.004, 0.22 * v, 0.07);
      tone(t + 0.16, 'triangle', 2950, 2950, 0.004, 0.22 * v, 0.07);
    },
  };
})();

// Timed one-shot sounds on the animation timeline.
function soundEvents(from, to) {
  if (!Sound) return;
  const D = S.duration;
  const events = [[0, 'tvOn'], [0.12, 'beep']];
  if (S.fadeOut) events.push([Math.max(0, D - 0.3), 'tvOff']);
  for (const [at, name] of events) if (at >= from && at < to) Sound[name]();
}

// Browsers only allow sound after a click or key press.
if (Sound) for (const ev of ['pointerdown', 'keydown']) document.addEventListener(ev, () => Sound.ensure(), true);

/* ================================================================
   Playback
   ================================================================ */
let time = 0, playing = true, last = performance.now();
let recorder = null, recording = false, recCancelled = false;

const playBtn = document.getElementById('playBtn');
const replayBtn = document.getElementById('replayBtn');
const scrub = document.getElementById('scrub');
const timeEl = document.getElementById('time');
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

function setPlaying(v) { playing = v; playBtn.innerHTML = v ? ICON_PAUSE : ICON_PLAY; }

const muteBtn = document.getElementById('muteBtn');
const ICON_SOUND = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2zM18.4 6a8.5 8.5 0 0 1 0 12L17 16.6a6.5 6.5 0 0 0 0-9.2z"/></svg>';
const ICON_MUTED = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9.4l1.4-1.4 2.1 2.1 2.1-2.1L23 9.4l-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1z"/></svg>';
function updateMute() { muteBtn.innerHTML = S.audioOn ? ICON_SOUND : ICON_MUTED; muteBtn.style.color = S.audioOn ? '' : 'var(--muted)'; }
muteBtn.onclick = () => { S.audioOn = !S.audioOn; save(); updateMute(); refreshers.forEach(f => f()); };
if (!Sound) muteBtn.hidden = true;

function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (playing) {
    const prev = time;
    time += dt;
    if (time >= S.duration) {
      soundEvents(prev, S.duration + 1);
      if (recording) { time = S.duration; setPlaying(false); finishRecording(); }
      else if (S.loop) { time = time % S.duration; soundEvents(0, time); }
      else { time = S.duration; setPlaying(false); }
    } else {
      soundEvents(prev, time);
    }
  }
  render(time);
  if (Sound) Sound.update(frameSound, playing);
  updateTransport();
  requestAnimationFrame(tick);
}

function updateTransport() {
  scrub.max = S.duration;
  if (document.activeElement !== scrub) scrub.value = time;
  timeEl.textContent = `${recording ? '● REC  ' : ''}${time.toFixed(2)} / ${S.duration.toFixed(2)}s`;
  timeEl.style.color = recording ? 'var(--rec)' : '';
}

playBtn.onclick = () => {
  if (recording) return;
  if (!playing && time >= S.duration) time = 0;
  setPlaying(!playing);
};
replayBtn.onclick = () => { if (recording) return; time = 0; setPlaying(true); };
scrub.oninput = () => { if (recording) return; setPlaying(false); time = +scrub.value; };
document.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' && e.target.type === 'text' || tag === 'select' || tag === 'button') return;
  e.preventDefault(); playBtn.click();
});

// Fit the 16:9 canvas to the available space.
const viewport = document.getElementById('viewport');
new ResizeObserver(() => {
  const r = viewport.getBoundingClientRect();
  const w = Math.max(100, Math.min(r.width, r.height * 16 / 9));
  canvas.style.width = w + 'px';
  canvas.style.height = (w * 9 / 16) + 'px';
}).observe(viewport);

/* ================================================================
   Export
   ================================================================ */
const FORMAT_CANDIDATES = [
  ['video/mp4;codecs=avc1.640028', 'MP4 (H.264)'],
  ['video/mp4;codecs=avc1', 'MP4 (H.264)'],
  ['video/mp4', 'MP4'],
  ['video/webm;codecs=vp9', 'WebM (VP9)'],
  ['video/webm;codecs=vp8', 'WebM (VP8)'],
  ['video/webm', 'WebM'],
];
const canRecord = typeof MediaRecorder !== 'undefined' && typeof canvas.captureStream === 'function';
const formats = [];
if (canRecord) {
  const seen = new Set();
  for (const [type, label] of FORMAT_CANDIDATES) {
    const container = type.split(';')[0];
    const generic = !type.includes('codecs');
    try {
      if (!MediaRecorder.isTypeSupported(type) || seen.has(label)) continue;
      if (generic && formats.some(f => f.type.startsWith(container))) continue;   // already have a specific codec
      seen.add(label); formats.push({ type, label });
    } catch {}
  }
}
if (!formats.some(f => f.type === S.format)) S.format = formats[0] ? formats[0].type : '';

const recBtn = document.getElementById('recBtn');
const recLabel = document.getElementById('recLabel');

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// Pick a container/codec string that also carries an audio track.
function withAudio(type) {
  const isMp4 = type.startsWith('video/mp4');
  const m = type.match(/codecs=([^;]+)/);
  const v = m ? m[1] : (isMp4 ? 'avc1' : 'vp9');
  const base = type.split(';')[0];
  const tries = isMp4 ? [`${base};codecs=${v},mp4a.40.2`, `${base};codecs=${v},opus`] : [`${base};codecs=${v},opus`];
  for (const t of tries) { try { if (MediaRecorder.isTypeSupported(t)) return t; } catch {} }
  return type;
}

function startRecording() {
  let type = S.format;
  const video = canvas.captureStream(+S.fps);
  let stream = video;
  if (S.audioExport && Sound) {
    const audioTrack = Sound.track();
    if (audioTrack) { stream = new MediaStream([...video.getVideoTracks(), audioTrack]); type = withAudio(type); }
  }
  try {
    recorder = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: S.bitrate * 1e6, audioBitsPerSecond: 192000 });
  } catch (err) {
    video.getTracks().forEach(tr => tr.stop());
    alert('Could not start the recorder in this browser: ' + err.message);
    return;
  }
  const chunks = [];
  recCancelled = false;
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    video.getTracks().forEach(tr => tr.stop());   // the shared audio track stays alive for next time
    recording = false; recorder = null;
    updateRecUI();
    if (recCancelled || !chunks.length) return;
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    download(new Blob(chunks, { type: type.split(';')[0] }), `vhs-title-${stamp()}.${ext}`);
  };
  time = 0;
  render(0);
  last = performance.now();
  recording = true;
  setPlaying(true);
  recorder.start(250);
  updateRecUI();
}
function finishRecording() {
  if (!recorder) return;
  const r = recorder;
  setTimeout(() => { if (r.state !== 'inactive') r.stop(); }, 500);   // hold the last frame and let sound tails ring out
}
function cancelRecording() {
  if (!recorder) return;
  recCancelled = true;
  setPlaying(false);
  recorder.stop();
}
function updateRecUI() {
  recBtn.classList.toggle('recording', recording);
  recBtn.classList.toggle('primary', !recording);
  recLabel.textContent = recording ? 'Recording… (cancel)' : 'Export video';
  recBtn.disabled = !formats.length;
  replayBtn.disabled = playBtn.disabled = scrub.disabled = recording;
}
recBtn.onclick = () => (recording ? cancelRecording() : startRecording());

document.getElementById('pngBtn').onclick = () => {
  canvas.toBlob(b => b && download(b, `vhs-title-${stamp()}.png`), 'image/png');
};

/* ================================================================
   Control panel
   ================================================================ */
const fontOptions = () => {
  const o = Object.entries(FONTS).map(([id, f]) => ({ id, ...f }));
  if (customFontLabel) o.push({ id: 'custom', label: customFontLabel, family: '"VHSCustomFont", sans-serif', weight: 400 });
  return o;
};

// Make sure the chosen web font is actually loaded before the canvas uses it.
function ensureFont() {
  if (!document.fonts || !document.fonts.load) return;
  document.fonts.load(fontSpec(100), 'SUMMER 1994').then(() => { dirty = true; }, () => {});
}

    { k: 'letterSpacing', type: 'range', label: 'Title letter spacing', min: -20, max: 80, step: 1, unit: 'px' },
    { k: 'lineHeight', type: 'range', label: 'Line spacing', min: 0.6, max: 1.6, step: 0.01 },
    { k: 'titleX', type: 'range', label: 'Horizontal position', min: -700, max: 700, step: 1, unit: 'px' },
    { k: 'titleY', type: 'range', label: 'Title vertical offset', min: -450, max: 450, step: 1, unit: 'px' },
    { k: 'subSize', type: 'range', label: 'Top text size', min: 14, max: 140, step: 1, unit: 'px' },
    { k: 'subSpacing', type: 'range', label: 'Top text letter spacing', min: -5, max: 80, step: 1, unit: 'px' },
    { k: 'subY', type: 'range', label: 'Top text position (from top)', min: 30, max: 1050, step: 1, unit: 'px' },
  ] },
  { title: 'Colour', items: [
    { type: 'colors', items: [
      { k: 'textColor', label: 'Text' }, { k: 'bgColor', label: 'Background' },
      { k: 'glowColor', label: 'Glow' }, { k: 'glow2Color', label: 'Outer glow' },
      { k: 'abColorA', label: 'Fringe left' }, { k: 'abColorB', label: 'Fringe right' },
    ] },
  ] },
  { title: 'Animation', open: true, items: [
    { k: 'duration', type: 'range', label: 'Total duration', min: 2, max: 30, step: 0.5, unit: 's' },
    { k: 'intro', type: 'range', label: 'Glitch-in length', min: 0.3, max: 10, step: 0.1, unit: 's' },
    { k: 'loop', type: 'check', label: 'Loop preview' },
    { k: 'fadeOut', type: 'check', label: 'Glitch out at the end (with TV-off sound)' },
  ] },
  { title: 'Sound', open: true, items: [
    { k: 'audioOn', type: 'check', label: 'Play sound in preview' },
    { k: 'volMaster', type: 'range', label: 'Master volume', min: 0, max: 1, step: 0.01 },
    { k: 'volHiss', type: 'range', label: 'Tape hiss & hum', min: 0, max: 1, step: 0.01 },
    { k: 'volStatic', type: 'range', label: 'Static (glitch-in / out)', min: 0, max: 1, step: 0.01 },
    { k: 'volGlitch', type: 'range', label: 'Tracking glitches', min: 0, max: 1, step: 0.01 },
    { k: 'volBeep', type: 'range', label: 'Camcorder beep', min: 0, max: 1, step: 0.01 },
    { k: 'volTv', type: 'range', label: 'TV on / off', min: 0, max: 1, step: 0.01 },
    { k: 'audioExport', type: 'check', label: 'Include sound in exported video' },
    { type: 'note', text: 'All sounds are generated live and follow the picture. The TV-off sound plays when "Glitch out at the end" is on. Browsers start sound only after your first click.' },
  ] },
  { title: 'Export', open: true, items: [{ type: 'export' }] },
];

const panel = document.getElementById('panel');
const refreshers = [];

function fmt(v, step) {
  const dec = step >= 1 ? 0 : step >= 0.1 ? 1 : 2;
  return (+v).toFixed(dec);
}

function set(k, v) {
  S[k] = v;
  if (k === 'audioOn') updateMute();
  if (!LIVE_KEYS.has(k)) dirty = true;
  if (k === 'duration' && time > v) time = v;
  save();
}

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [a, v] of Object.entries(props)) {
    if (a === 'class') n.className = v; else if (a in n) n[a] = v; else n.setAttribute(a, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
}

function buildControl(it) {
  if (it.type === 'text') {
    const inp = el('input', { type: 'text', value: S[it.k], spellcheck: false });
    inp.oninput = () => set(it.k, inp.value);
    refreshers.push(() => { inp.value = S[it.k]; });
    return el('label', { class: 'field' }, el('div', { class: 'top' }, it.label), inp);
  }
  if (it.type === 'range') {
    const out = el('output');
    const inp = el('input', { type: 'range', min: it.min, max: it.max, step: it.step, value: S[it.k] });
    const show = () => { out.textContent = fmt(S[it.k], it.step) + (it.unit || ''); };
    inp.oninput = () => { set(it.k, +inp.value); show(); };
    refreshers.push(() => { inp.value = S[it.k]; show(); });
    show();
    return el('label', { class: 'field' }, el('div', { class: 'top' }, el('span', {}, it.label), out), inp);
  }
  if (it.type === 'fonts') {
    const grid = el('div', { class: 'fonts', role: 'listbox', 'aria-label': 'Font' });
    const fill = () => {
      grid.innerHTML = '';
      for (const f of fontOptions()) {
        const b = el('button', { type: 'button', class: 'font-tile' + (S.font === f.id ? ' on' : ''), textContent: f.label, title: f.label });
        b.style.fontFamily = f.family;
        b.style.fontWeight = f.weight;
        b.onclick = () => { set('font', f.id); ensureFont(); fill(); };
        grid.append(b);
      }
    };
    refreshers.push(fill);
    fill();
    return el('div', { class: 'field' }, el('div', { class: 'top' }, it.label), grid);
  }
  if (it.type === 'select') {
    const sel = el('select');
    const fill = () => {
      sel.innerHTML = '';
      for (const [v, l] of it.options()) sel.append(el('option', { value: v, textContent: l }));
      sel.value = S[it.k];
    };
    sel.onchange = () => set(it.k, sel.value);
    refreshers.push(fill);
    fill();
    return el('label', { class: 'field' }, el('div', { class: 'top' }, it.label), sel);
  }
  if (it.type === 'check') {
    const inp = el('input', { type: 'checkbox', checked: !!S[it.k] });
    inp.onchange = () => set(it.k, inp.checked);
    refreshers.push(() => { inp.checked = !!S[it.k]; });
    return el('label', { class: 'check' }, inp, it.label);
  }
  if (it.type === 'colors') {
    const wrap = el('div', { class: 'colors' });
    for (const c of it.items) {
      const inp = el('input', { type: 'color', value: S[c.k] });
      inp.oninput = () => set(c.k, inp.value);
      refreshers.push(() => { inp.value = S[c.k]; });
      wrap.append(el('label', { class: 'color' }, inp, c.label));
    }
    return wrap;
  }
  if (it.type === 'fontUpload') {
    const btn = el('button', { class: 'btn', type: 'button', textContent: 'Load a font file (.ttf / .otf / .woff)…' });
    btn.onclick = () => fontFile.click();
    return btn;
  }
  if (it.type === 'export') return buildExport();
  if (it.type === 'note') return el('div', { class: 'note', textContent: it.text });
}

function buildExport() {
  const box = el('div', { class: 'body', style: 'padding:0' });
  if (!formats.length) {
    box.append(el('div', { class: 'note', textContent:
      'This browser cannot record canvas video (MediaRecorder is unavailable). Open this file in a current version of Chrome, Edge, Firefox or Safari to export video. "Save frame" still works.' }));
    return box;
  }
  const fmtSel = el('select');
  for (const f of formats) fmtSel.append(el('option', { value: f.type, textContent: f.label }));
  fmtSel.value = S.format;

  const fpsSel = el('select');
  for (const v of [24, 30, 60]) fpsSel.append(el('option', { value: v, textContent: v + ' fps' }));
  fpsSel.value = S.fps;

  const brSel = el('select');
  for (const [v, l] of [[8, 'Standard · 8 Mbps'], [20, 'High · 20 Mbps'], [40, 'Max · 40 Mbps']]) brSel.append(el('option', { value: v, textContent: l }));
  brSel.value = S.bitrate;

  const note = el('div', { class: 'note' });
  const updateNote = () => {
    const isWebm = S.format.includes('webm');
    const hasMp4 = formats.some(f => f.type.includes('mp4'));
    note.innerHTML = '';
    note.append(`Records the full ${S.duration.toFixed(1)}s animation in real time at 1920 × 1080. Keep this tab visible while it records.`);
    if (isWebm) {
      note.append(el('br'), el('br'),
        hasMp4 ? 'MP4 is also available in the format menu above. ' : 'This browser can only record WebM. ',
        'To convert WebM to MP4, install ffmpeg and run:',
        el('code', { textContent: 'ffmpeg -i vhs-title.webm -c:v libx264 -pix_fmt yuv420p -crf 16 -r 30 vhs-title.mp4' }));
    }
  };
  fmtSel.onchange = () => { set('format', fmtSel.value); updateNote(); };
  fpsSel.onchange = () => set('fps', +fpsSel.value);
  brSel.onchange = () => set('bitrate', +brSel.value);
  refreshers.push(updateNote);
  updateNote();

  box.append(
    el('label', { class: 'field' }, el('div', { class: 'top' }, 'Format'), fmtSel),
    el('div', { class: 'row' },
      el('label', { class: 'field' }, el('div', { class: 'top' }, 'Frame rate'), fpsSel),
      el('label', { class: 'field' }, el('div', { class: 'top' }, 'Quality'), brSel)),
    note);
  return box;
}

for (const sec of SECTIONS) {
  const body = el('div', { class: 'body' });
  for (const it of sec.items) body.append(buildControl(it));
  panel.append(el('details', { open: !!sec.open }, el('summary', {}, sec.title), body));
}
const resetBtn = el('button', { class: 'btn', type: 'button', textContent: 'Reset to defaults' });
resetBtn.onclick = () => {
  const keep = { format: S.format, fps: S.fps, bitrate: S.bitrate };
  S = { ...DEFAULTS, ...keep };
  save(); dirty = true;
  refreshers.forEach(f => f());
  time = 0; setPlaying(true);
};
panel.append(el('div', { class: 'foot' }, resetBtn));

const fontFile = document.getElementById('fontFile');
fontFile.onchange = async () => {
  const file = fontFile.files[0];
  if (!file) return;
  try {
    const face = new FontFace('VHSCustomFont', await file.arrayBuffer());
    await face.load();
    document.fonts.add(face);
    customFontLabel = file.name.replace(/\.[^.]+$/, '');
    S.font = 'custom'; dirty = true;   // not saved: uploaded fonts don't persist across reloads
    refreshers.forEach(f => f());
  } catch (err) {
    alert('Could not load that font file: ' + err.message);
  }
  fontFile.value = '';
};

/* ================================================================
   Go
   ================================================================ */
setPlaying(true);
updateRecUI();
updateMute();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { dirty = true; });
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => { dirty = true; });
ensureFont();
requestAnimationFrame(t => { last = t; requestAnimationFrame(tick); });

// Small hook for automated testing.
window.__vhs = { render, get settings() { return S; }, seek: v => { time = v; setPlaying(false); }, formats };
})();
</script>
</body>
</html>
